name: CI DaniPak Pipeline

# El pipeline se dispara cada vez que se hace un pull request hacia la rama main
on:
  pull_request:
    branches: [ "main" ]

jobs:
  auditar-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Instalar dependencias del Backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # Esto es para mas adelante otro paso cuando hayan tests, para que se ejecuten y verifiquen que todo funciona
      - name: Verificar que la API compila (Dry Run)
        run: |
          cd backend
          python -c "from app.main import app"

  auditar-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Instalar y compilar PWA
        run: |
          cd frontend
          npm install
          npm run build