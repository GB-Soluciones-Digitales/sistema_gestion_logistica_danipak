services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: danipak_user
      POSTGRES_PASSWORD: danipak_password
      POSTGRES_DB: danipak_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://danipak_user:danipak_password@db:5432/danipak_db
    depends_on:
      - db

  frontend:
    build: ./frontend/frontend_sistema_danipak
    ports:
      - "5173:80"
    depends_on:
      - backend
  
volumes:
  pgdata: